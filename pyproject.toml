[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code2video-suite"
version = "1.0.0"
description = "Code2Video: Reliable and Efficient Generation of Educational Videos with Adaptive Planning, Verification, and Repair"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "manim>=0.19.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
    "pytest>=7.0.0"
]

[project.scripts]
code2video = "code2video.cli:main"
adapt-manim = "adapt_manim.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adapt_manim*", "code2video*"]

[tool.pytest.ini_options]
pythonpath = ["."]
