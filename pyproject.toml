[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adapt-manim"
version = "1.0.0"
description = "Reliable & Efficient Educational Video Generation with Adaptive Planning, Multi-Tier Verification, and Scoped Repair"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "manim>=0.19.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
    "pytest>=7.0.0"
]

[project.scripts]
adapt-manim = "adapt_manim.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adapt_manim*"]
