[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lessonforge"
version = "0.1.0"
description = "Narrated STEM lesson videos with Manim: storyboard IR -> deterministic transpiler -> verified render, plus audio-first long-form lessons with captions, chapters and checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - see PROVENANCE.md" }
authors = [{ name = "Manideep Donkena" }]
dependencies = [
    # Manim + voiceover
    "manim>=0.19.0",
    "manim-voiceover>=0.4.0",
    "gTTS>=2.5",                 # keyless speech fallback tier
    "pydub>=0.25",
    # Contracts
    "pydantic>=2.7",
    # Numeric / image
    "numpy>=1.26",
    "pillow>=10",
    "matplotlib>=3.8",           # generated icons run in an isolated subprocess
    # Engine server + providers
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "websockets>=12",            # /ws/render_status
    "google-genai>=1.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "json_repair>=0.30",         # lenient recovery of slightly malformed LLM JSON
]

[project.optional-dependencies]
# Each tier is probed at its own call site and degrades to a warning when absent.
chem = ["rdkit"]                                          # chemical_molecule elements
sources = ["youtube-transcript-api>=1.0", "beautifulsoup4>=4.12", "yt-dlp>=2025.1"]   # source intake
rag = ["chromadb>=1.0"]                                   # CHROMADB_ENABLED=1
kokoro = ["kokoro-onnx>=0.4", "soundfile>=0.12", "onnxruntime>=1.17"]  # local long-form narration
voices = ["edge-tts>=7"]                                  # Microsoft's free online voices (LGPLv3)
cloud = ["boto3>=1.34"]                                   # Cloudflare R2: `lessonforge publish`, the viewer site (lessonforge/cloud.py)
mcp = ["mcp>=1.2,<2"]                                    # `lessonforge mcp`: the workbench as an MCP server
all = ["lessonforge[chem,sources,rag,kokoro,voices,cloud,mcp]"]
dev = ["pytest>=8"]

[project.scripts]
lessonforge = "lessonforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lessonforge = [
    "web/static/*",
    "schemas/*.json",
    "harness/concepts/*.json",
    "harness/storyflow_band.json",
    "assets/backgrounds/*",
    "engine/README.md",
    "longform/templates/*",
]

[tool.pytest.ini_options]
# tests/engine/ holds script-style harnesses (run them with tests/run_engine_checks.py).
testpaths = ["tests/unit"]
